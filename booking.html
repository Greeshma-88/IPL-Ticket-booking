<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IPL Ticket Booking Form</title>
  <link rel="stylesheet" href="CSS/style.css">
</head>
<body>

  <!-- NAVIGATION BAR -->
  <header>
    <nav>
      <h2>IPL Tickets</h2>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="index.html#matches">Matches</a></li>
        <li><a href="booking.html">Book Ticket</a></li>
        <li><a href="index.html#guidelines">Guidelines</a></li>
      </ul>
    </nav>
  </header>

  <!-- BOOKING FORM -->
  <section id="booking">
    <h2>Ticket Booking Form</h2>

    <form class="booking-form" action="#" method="post">

      <label for="name">Full Name</label>
      <input type="text" id="name" name="name" placeholder="Enter your name"
             required minlength="3" maxlength="30">

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="Enter your email" required>

      <label for="phone">Phone Number</label>
      <input type="tel" id="phone" name="phone" placeholder="10-digit mobile number"
             required minlength="10" maxlength="10" pattern="[0-9]{10}"
             title="Enter exactly 10 digits">

      <label for="match">Select Match</label>
      <select id="match" name="match" required>
        <option value="">-- Choose a match --</option>
        <option>CSK vs MI</option>
        <option>RCB vs KKR</option>
        <option>SRH vs CSK</option>
        <option>MI vs RCB</option>
      </select>

      <label for="stand">Stand Category</label>
      <select id="stand" name="stand" required>
        <option value="">-- Choose a stand --</option>
        <option>General</option>
        <option>Premium</option>
        <option>VIP</option>
      </select>

      <label for="tickets">Number of Tickets (1 to 10)</label>
      <input type="number" id="tickets" name="tickets" min="1" max="10" value="1" required>

      <!-- Radio buttons -->
      <label>Ticket Type</label>
      <input type="radio" id="eticket" name="type" value="E-Ticket" required>
      <label for="eticket" style="display:inline;">E-Ticket</label>
      <input type="radio" id="physical" name="type" value="Physical">
      <label for="physical" style="display:inline;">Physical Ticket</label>

      <!-- Checkboxes -->
      <label>Additional Preferences</label>
      <input type="checkbox" id="parking" name="pref" value="Parking">
      <label for="parking" style="display:inline;">Parking</label>
      <input type="checkbox" id="food" name="pref" value="Food Combo">
      <label for="food" style="display:inline;">Food Combo</label>
      <input type="checkbox" id="jersey" name="pref" value="Jersey">
      <label for="jersey" style="display:inline;">Team Jersey</label>

      <!-- Terms checkbox -->
      <br><br>
      <input type="checkbox" id="terms" name="terms" required>
      <label for="terms" style="display:inline;">I agree to the terms and conditions</label>

      <!-- Buttons -->
      <button type="submit">Submit</button>
      <button type="reset">Reset</button>

    </form>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>&copy; 2026 IPL Ticket Booking | Greeshma V (R25EF092)</p>
  </footer>

</body>
</html>
